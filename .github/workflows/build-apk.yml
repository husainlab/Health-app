name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Expo types
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Generate Android project (prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/credentials/release.keystore
          RELEASE_STORE_PASSWORD: healthapp123
          RELEASE_KEY_ALIAS: health
          RELEASE_KEY_PASSWORD: healthapp123
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify Signed APK
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Health-0.4.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Health-release-apk
          path: android/app/build/outputs/apk/release/Health-0.4.1.apk
          if-no-files-found: error
