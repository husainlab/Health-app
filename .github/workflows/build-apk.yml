name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af || true
          df -h

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump Version Number
        id: bump_version
        run: |
          node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const pkgJson = JSON.parse(fs.readFileSync("package.json", "utf8"));

            // Parse version semver (major.minor.patch)
            const parts = (appJson.expo.version || "0.4.1").split(".").map(Number);
            parts[2] = (parts[2] || 0) + 1;
            const newVersion = parts.join(".");

            // Update app.json
            appJson.expo.version = newVersion;
            if (!appJson.expo.android) appJson.expo.android = {};
            const currentCode = appJson.expo.android.versionCode || 1;
            appJson.expo.android.versionCode = currentCode + 1;

            // Update package.json
            pkgJson.version = newVersion;

            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2) + "\n");
            fs.writeFileSync("package.json", JSON.stringify(pkgJson, null, 2) + "\n");

            console.log(`Bumped version to ${newVersion} (versionCode: ${appJson.expo.android.versionCode})`);
            const fsOutput = process.env.GITHUB_OUTPUT;
            if (fsOutput) {
              fs.appendFileSync(fsOutput, `new_version=${newVersion}\n`);
              fs.appendFileSync(fsOutput, `version_code=${appJson.expo.android.versionCode}\n`);
            }
          '

      - name: Set up Expo types
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Generate Android project (prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK (arm64-v8a for OnePlus Nord)
        env:
          EXPO_PUBLIC_GITHUB_TOKEN: ${{ secrets.GH_PAT_READ || '' }}
          RELEASE_STORE_FILE: ${{ github.workspace }}/credentials/release.keystore
          RELEASE_STORE_PASSWORD: healthapp123
          RELEASE_KEY_ALIAS: health
          RELEASE_KEY_PASSWORD: healthapp123
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          GRADLE_OPTS: -Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=true
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify Signed APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          echo "Found APK: $APK_FILE"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK_FILE"
          cp "$APK_FILE" "android/app/build/outputs/apk/release/Health-${{ steps.bump_version.outputs.new_version }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Health-release-apk
          path: "android/app/build/outputs/apk/release/Health-${{ steps.bump_version.outputs.new_version }}.apk"
          if-no-files-found: error

      - name: Commit and push APK and version bump to root of repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_VER="${{ steps.bump_version.outputs.new_version }}"
          APK_SRC="android/app/build/outputs/apk/release/Health-${NEW_VER}.apk"

          # Remove old versioned APKs
          git rm -f Health-*.apk 2>/dev/null || true

          # Copy both versioned APK and fixed Health-release.apk
          cp "$APK_SRC" "./Health-${NEW_VER}.apk"
          cp "$APK_SRC" "./Health-release.apk"

          # Stage and commit locally before any fetch/push
          git add -f "Health-${NEW_VER}.apk" "Health-release.apk" app.json package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${NEW_VER} and update APK [skip ci]"
          fi

          # Retry loop to push to origin main
          MAX_RETRIES=5
          PUSH_SUCCESS=0
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            if git push origin HEAD:main; then
              echo "Successfully pushed APK and version bump to main branch!"
              PUSH_SUCCESS=1
              break
            fi

            echo "Push failed. Fetching origin main and rebasing..."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              echo "Rebase conflict occurred, aborting rebase..."
              git rebase --abort || true
              git merge -X theirs --no-edit origin/main || true
            fi
            sleep 5
          done

          if [ "$PUSH_SUCCESS" -ne 1 ]; then
            echo "Failed to push release after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          NEW_VER="${{ steps.bump_version.outputs.new_version }}"
          gh release create "v${NEW_VER}" \
            "Health-${NEW_VER}.apk" \
            "Health-release.apk" \
            --title "Health ${NEW_VER}" \
            --notes "Production signed APK for Health ${NEW_VER}" \
            --clobber || true
