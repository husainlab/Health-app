name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump Version Number
        id: bump_version
        run: |
          node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const pkgJson = JSON.parse(fs.readFileSync("package.json", "utf8"));

            // Parse version semver (major.minor.patch)
            const parts = (appJson.expo.version || "0.4.1").split(".").map(Number);
            parts[2] = (parts[2] || 0) + 1;
            const newVersion = parts.join(".");

            // Update app.json
            appJson.expo.version = newVersion;
            if (!appJson.expo.android) appJson.expo.android = {};
            const currentCode = appJson.expo.android.versionCode || 1;
            appJson.expo.android.versionCode = currentCode + 1;

            // Update package.json
            pkgJson.version = newVersion;

            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2) + "\n");
            fs.writeFileSync("package.json", JSON.stringify(pkgJson, null, 2) + "\n");

            console.log(`Bumped version to ${newVersion} (versionCode: ${appJson.expo.android.versionCode})`);
            const fsOutput = process.env.GITHUB_OUTPUT;
            if (fsOutput) {
              fs.appendFileSync(fsOutput, `new_version=${newVersion}\n`);
              fs.appendFileSync(fsOutput, `version_code=${appJson.expo.android.versionCode}\n`);
            }
          '

      - name: Set up Expo types
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Generate Android project (prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/credentials/release.keystore
          RELEASE_STORE_PASSWORD: healthapp123
          RELEASE_KEY_ALIAS: health
          RELEASE_KEY_PASSWORD: healthapp123
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify Signed APK
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/Health-${{ steps.bump_version.outputs.new_version }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Health-release-apk
          path: "android/app/build/outputs/apk/release/Health-${{ steps.bump_version.outputs.new_version }}.apk"
          if-no-files-found: error

      - name: Commit and push APK and version bump to root of repository
        run: |
          git rm -f Health-*.apk 2>/dev/null || true
          cp "android/app/build/outputs/apk/release/Health-${{ steps.bump_version.outputs.new_version }}.apk" "./Health-${{ steps.bump_version.outputs.new_version }}.apk"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "Health-${{ steps.bump_version.outputs.new_version }}.apk" app.json package.json
          git commit -m "chore(release): bump version to ${{ steps.bump_version.outputs.new_version }} and update APK [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin main

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump_version.outputs.new_version }}" "Health-${{ steps.bump_version.outputs.new_version }}.apk" \
            --title "Health ${{ steps.bump_version.outputs.new_version }}" \
            --notes "Production signed APK for Health ${{ steps.bump_version.outputs.new_version }}" \
            --clobber || true
